name: Inference performance observations
on:
  workflow_dispatch:
    inputs:
      runners:
        description: 'JSON runner list; use persistent self-hosted runners for build regression baselines'
        default: '["ubuntu-22.04", "ubuntu-24.04"]'
        required: true
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Prepare, seal, observe, and report
        run: |
          nix develop .#stable --command bash -euo pipefail -c '
            python3 tools/bench/alea-bench prepare tools/bench/protocols/reference-v1.json target/m16-engines
            python3 tools/bench/alea-bench seal tools/bench/protocols/reference-v1.json target/m16-manifest.json
            python3 tools/bench/alea-bench run target/m16-manifest.json target/m16-engines/engines.json target/m16-observation
            python3 tools/bench/alea-bench track target/m16-observation --output target/m16-observation/tracking.json
          '
      - name: Preserve measurements and preparation failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m16-${{ strategy.job-index }}-${{ github.run_id }}
          path: |
            target/m16-observation
            target/m16-engines/*.log
            target/m16-engines/*.json
            target/m16-manifest.json
          if-no-files-found: error

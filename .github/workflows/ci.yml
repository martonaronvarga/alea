name: Rust gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: stable
            features: ''
          - shell: stable
            features: alea-mcmc/faer
          - shell: default
            features: alea-mcmc/simd,alea-distributions/simd,alea-distributions/branch-hints
          - shell: blas
            features: alea-mcmc/simd,alea-distributions/simd,alea-mcmc/faer,alea-mcmc/openblas
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Format, check, test, Clippy, docs
        env:
          ALEA_SHELL: ${{ matrix.shell }}
          ALEA_FEATURES: ${{ matrix.features }}
        run: nix develop ".#$ALEA_SHELL" --command bash tools/ci/check.sh "$ALEA_FEATURES"
  autodiff:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Execute compiled Enzyme gradients and opaque derivative composition
        run: nix develop .#autodiff --command bash tools/ci/autodiff.sh
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - run: nix develop --command bash tools/ci/miri.sh

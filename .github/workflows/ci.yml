name: Rust gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  CARGO_INCREMENTAL: '0'
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: stable
            features: ''
            scope: all
          - shell: stable
            features: alea/faer,alea/distributions
            scope: workspace
          - shell: default
            features: alea/simd,alea/distributions,alea/branch-hints
            scope: workspace
          - shell: blas
            features: alea/simd,alea/distributions,alea/faer,alea/openblas
            scope: workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Format, check, test, Clippy, docs
        env:
          ALEA_SHELL: ${{ matrix.shell }}
          ALEA_FEATURES: ${{ matrix.features }}
          ALEA_SCOPE: ${{ matrix.scope }}
        run: python3 tools/ci/run.py --log "$RUNNER_TEMP/native.log" -- nix develop ".#$ALEA_SHELL" --command bash tools/ci/check.sh "$ALEA_FEATURES" "$ALEA_SCOPE"
  autodiff:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Execute compiled Enzyme gradients and opaque derivative composition
        run: python3 tools/ci/run.py --log "$RUNNER_TEMP/autodiff.log" -- nix develop .#autodiff --command bash tools/ci/autodiff.sh
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [storage, targets, hmc, nuts, research, runtime]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - env:
          ALEA_MIRI_SCOPE: ${{ matrix.scope }}
        run: python3 tools/ci/run.py --log "$RUNNER_TEMP/miri.log" -- nix develop --command bash tools/ci/miri.sh "$ALEA_MIRI_SCOPE"
      - name: Retain interpreter diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miri-${{ matrix.scope }}-${{ github.run_id }}
          path: ${{ runner.temp }}/miri.log
          if-no-files-found: warn

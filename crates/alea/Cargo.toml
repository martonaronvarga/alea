[package]
name = "alea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Bayesian modeling and Monte Carlo inference in Rust"
keywords = ["bayesian", "statistics", "inference", "mcmc"]
categories = ["science", "mathematics"]

[lints]
workspace = true

[dependencies]
alea-core.workspace = true
alea-math.workspace = true
alea-mcmc.workspace = true
alea-runtime.workspace = true
alea-distributions = { workspace = true, optional = true }
alea-autodiff = { workspace = true, optional = true }

[features]
default = []
distributions = ["dep:alea-distributions"]
autodiff = ["dep:alea-autodiff"]
faer = ["alea-math/faer", "alea-mcmc/faer", "alea-runtime/faer"]
openblas = ["alea-math/openblas", "alea-mcmc/openblas"]
simd = ["alea-math/simd", "alea-mcmc/simd", "alea-distributions?/simd"]
branch-hints = ["distributions", "alea-distributions/branch-hints"]
std-autodiff = ["autodiff", "alea-autodiff/std-autodiff"]

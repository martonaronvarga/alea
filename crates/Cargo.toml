[workspace]
resolver = "3"
members = ["alea", "alea-math", "alea-core", "alea-distributions", "alea-autodiff", "alea-mcmc", "alea-runtime", "alea-smc", "alea-ffi", "alea-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
authors = ["Marton Aron Varga <contact@martonaronvarga.dev>"]
repository = "https://github.com/martonaronvarga/alea"
homepage = "https://github.com/martonaronvarga/alea"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
alea = { version = "0.1.1", path = "alea" }
alea-math = { version = "0.1.1", path = "alea-math" }
alea-core = { version = "0.1.1", path = "alea-core" }
alea-distributions = { version = "0.1.1", path = "alea-distributions" }
alea-autodiff = { version = "0.1.1", path = "alea-autodiff" }
alea-mcmc = { version = "0.1.1", path = "alea-mcmc" }
alea-runtime = { version = "0.1.1", path = "alea-runtime" }
alea-smc = { version = "0.1.1", path = "alea-smc" }
alea-ffi = { version = "0.1.1", path = "alea-ffi" }
alea-cli = { version = "0.1.1", path = "alea-cli" }
rand = "0.10.1"
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }
rayon = "1.12"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
arc-swap = "1"
rustfft = "6"
statrs = { version = "0.18", default-features = false }
spec_math = "0.1.6"
thiserror = "2.0.18"
tracing = "0.1.44"
approx = "0.5.1"
once_cell = "1.21.4"
libm = "0.2.16"
faer = "0.24"
cblas = "0.4"
cc = "1.2"
pkg-config = "0.3"
aligned-vec = "=0.6.4"
pulp = { version = "=0.22.3", default-features = false, features = ["std", "x86-v3"] }
rand_distr = "=0.6.0"
allocation-counter = "=0.8.1"
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
criterion = "0.5"
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri)'] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "fat"

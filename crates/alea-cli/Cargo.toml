[package]
autoexamples = false
autobins = false
name = "alea-cli"
default-run = "alea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Command-line experiment and benchmark utilities for Alea"
keywords = ["bayesian", "statistics", "inference"]
categories = ["science", "mathematics"]

[lints]
workspace = true

[dependencies]
alea-core.workspace = true
alea-math.workspace = true
alea-distributions.workspace = true
alea-autodiff.workspace = true
alea-mcmc.workspace = true
alea-runtime.workspace = true
rand.workspace = true

[features]
default = []
std-autodiff = ["alea-autodiff/std-autodiff"]

[[bin]]
doc = false
name = "alea"
path = "src/main.rs"

[[bin]]
doc = false
name = "alea-gradient-check"
path = "src/bin/gradient_check.rs"

[[bin]]
doc = false
name = "alea-rwmh"
path = "src/bin/rwmh.rs"

[package]
autoexamples = false
name = "alea-distributions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Normalized probability distributions and native Alea models"
keywords = ["bayesian", "statistics", "inference"]
categories = ["science", "mathematics"]

[lints]
workspace = true

[dependencies]
tracing = { workspace = true, optional = true }
alea-core.workspace = true
alea-math.workspace = true
alea-ffi.workspace = true
rand.workspace = true
thiserror.workspace = true
once_cell.workspace = true
statrs.workspace = true
spec_math.workspace = true
libm.workspace = true

[dev-dependencies]
approx.workspace = true
criterion.workspace = true
pprof.workspace = true
allocation-counter.workspace = true

[features]
tracing = ["dep:tracing", "alea-core/tracing", "alea-math/tracing", "alea-ffi/tracing"]
default = []
faer = ["alea-math/faer"]
simd = ["alea-math/simd"]
branch-hints = []

[[bench]]
name = "wiener7"
harness = false

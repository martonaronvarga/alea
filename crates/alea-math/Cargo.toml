[build-dependencies]
cc = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
allocation-counter.workspace = true

[features]
default = []
simd = []
faer = ["dep:faer"]
openblas = ["dep:cblas", "dep:cc", "dep:pkg-config"]

[[bench]]
name = "storage"
harness = false

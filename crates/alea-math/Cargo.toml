[package]
autoexamples = false
name = "alea-math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Aligned storage and Euclidean geometry for Alea inference"
keywords = ["bayesian", "statistics", "inference"]
categories = ["science", "mathematics"]

[lints]
workspace = true

[dependencies]
tracing = { workspace = true, optional = true }
aligned-vec.workspace = true
rand.workspace = true
thiserror.workspace = true
num-bigint.workspace = true
libm = { workspace = true, optional = true }
pulp.workspace = true

faer = { workspace = true, optional = true }
cblas = { workspace = true, optional = true }

[build-dependencies]
cc = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }

[dev-dependencies]
alea = { workspace = true }
criterion.workspace = true
allocation-counter.workspace = true

[features]
tracing = ["dep:tracing"]
default = []
simd = []
faer = ["dep:faer", "dep:libm"]
openblas = ["dep:cblas", "dep:cc", "dep:pkg-config"]

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "quasi_newton"
harness = false

[package]
autoexamples = false
name = "alea-mcmc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Reference HMC, NUTS and explicitly selected research MCMC methods"
keywords = ["bayesian", "statistics", "inference"]
categories = ["science", "mathematics"]

[lints]
workspace = true

[dependencies]
pulp.workspace = true
rand_distr.workspace = true
alea-core.workspace = true
alea-math.workspace = true
rand.workspace = true
thiserror.workspace = true

[dev-dependencies]
alea = { workspace = true, features = ["distributions"] }
alea-distributions.workspace = true
allocation-counter.workspace = true
criterion.workspace = true
proptest.workspace = true

[features]
default = []
simd = ["alea-math/simd"]
faer = ["alea-math/faer"]
openblas = ["alea-math/openblas"]

[[bench]]
name = "hmc"
harness = false

[[bench]]
name = "rwmh"
harness = false

[[bench]]
name = "warmup"
harness = false

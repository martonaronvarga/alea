[package]
autoexamples = false
name = "alea-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Bounded inference sessions, diagnostics and durable output for Alea"
keywords = ["bayesian", "statistics", "inference"]
categories = ["science", "mathematics"]

[lints]
workspace = true

[dependencies]
alea-core.workspace = true
alea-mcmc.workspace = true
alea-math.workspace = true
rand.workspace = true
thiserror.workspace = true
chacha20.workspace = true
rayon.workspace = true
tokio.workspace = true
tokio-util.workspace = true
arc-swap.workspace = true
rustfft.workspace = true
statrs.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
alea-distributions.workspace = true
allocation-counter.workspace = true

[features]
default = []
analysis = ["dep:serde_json", "dep:sha2"]
faer = ["alea-mcmc/faer"]

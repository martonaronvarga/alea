[package]
name = "alea-stan-bench"
default-run = "alea-stan-bench"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
alea = { path = "../../crates/alea", features = ["distributions"] }
serde_json = "1"
rayon = "1.12"

[build-dependencies]
alea = { path = "../../crates/alea", features = ["autodiff", "distributions"], optional = true }

[features]
default = ["classified"]
classified = []
simd = ["alea/simd"]
faer = ["alea/faer"]
openblas = ["alea/openblas"]
enzyme = ["alea/std-autodiff"]
branch-hints = ["alea/branch-hints"]
tracing = ["alea/tracing"]
analysis = ["alea/analysis"]

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

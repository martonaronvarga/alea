[package]
name = "alea-stan-bench"
default-run = "alea-stan-bench"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
alea = { path = "../../crates/alea", features = ["distributions"] }
serde_json = "1"

[features]
default = ["classified"]
classified = []

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

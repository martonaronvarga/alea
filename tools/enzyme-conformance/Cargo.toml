[package]
name = "alea-enzyme-conformance"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
alea = { path = "../../crates/alea", features = ["std-autodiff", "distributions"] }

[build-dependencies]
alea = { path = "../../crates/alea", features = ["autodiff", "distributions"] }

[dev-dependencies]
rand = "=0.10.1"
allocation-counter = "=0.8.1"

[profile.release]
lto = "fat"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[package]
name = "alea-enzyme-conformance"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
bench = false

[dependencies]
alea = { path = "../../crates/alea", features = ["std-autodiff", "distributions"] }

[build-dependencies]
alea = { path = "../../crates/alea", features = ["autodiff", "distributions"] }

[dev-dependencies]
criterion = "0.5"
rand = "=0.10.1"
allocation-counter = "=0.8.1"

[features]
faer = ["alea/faer"]
simd = ["alea/simd"]

[[example]]
name = "gaussian_uncertainty"
required-features = ["faer"]

[[bench]]
name = "native_compiled"
harness = false

[profile.release]
lto = "fat"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[package]
name = "alea-pdb-worker"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
native-enzyme = ["dep:alea-autodiff"]

[dependencies]
alea-core = { path = "../../../crates/alea-core" }
alea-autodiff = { path = "../../../crates/alea-autodiff", features = ["std-autodiff"], optional = true }
alea-math = { path = "../../../crates/alea-math", features = ["faer"] }
alea-mcmc = { path = "../../../crates/alea-mcmc", features = ["faer"] }
alea-runtime = { path = "../../../crates/alea-runtime", features = ["faer"] }
bridgestan = { path = "../../../target/m16b-source/bridgestan/rust" }
nuts-rs = { path = "../../../target/nuts-reference-upstream", default-features = false }
rand = "=0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

libloading = "=0.8.9"

[build-dependencies]
alea-core = { path = "../../../crates/alea-core" }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
